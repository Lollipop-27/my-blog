<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Site.Title }}</title>
</head>

<body>

    <h1>{{ .Site.Title }}</h1>

    <p>{{ .Site.Params.description }}</p>

    <h2>Weeks</h2>

    <ul>
        {{ range .Pages }}
            <li>
                <a href="{{ .RelPermalink }}">
                    {{ .Title }}
                </a>
            </li>
        {{ end }}
    </ul>

</body>
</html>
